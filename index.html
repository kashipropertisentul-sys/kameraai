<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-EYE v2.5 | Ultra-Sensitive Mode</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .matrix-bg {
            background: radial-gradient(circle, #050505 0%, #000 100%);
        }
        .crt-effect::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="matrix-bg text-[#00ff41] font-mono overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const API_KEY = ""; // Masukkan API Key Anda di sini
        const AI_MODEL_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
        
        // --- KALIBRASI SENSITIVITAS TINGGI ---
        const AI_COOLDOWN_MS = 4000; // Jeda antar analisis dipercepat (4 detik)
        const MOTION_THRESHOLD = 1.0; // Ambang batas gerakan sangat rendah (1.0%)
        const FRAME_DIFF_SENSITIVITY = 15; // Perbedaan warna minimal untuk deteksi (lebih rendah = lebih sensitif)

        function App() {
            const [isMonitoring, setIsMonitoring] = useState(false);
            const [audioEnabled, setAudioEnabled] = useState(true);
            const [logs, setLogs] = useState([]);
            const [motionLevel, setMotionLevel] = useState(0);
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const captureCanvasRef = useRef(null);
            const previousFrameRef = useRef(null);
            const requestRef = useRef(0);
            const lastAnalysisTimeRef = useRef(0);
            const logsContainerRef = useRef(null);

            const addLog = useCallback((message, type = 'info') => {
                setLogs(prev => [...prev.slice(-25), {
                    id: Math.random().toString(36).substr(2, 9),
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour12: false }),
                    message,
                    type
                }]);
            }, []);

            const speakIndonesian = useCallback((text) => {
                if (!audioEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                window.speechSynthesis.speak(utterance);
            }, [audioEnabled]);

            const analyzeImage = async (base64Image) => {
                setIsAnalyzing(true);
                addLog('SENSITIVE SCAN: Perubahan terdeteksi. Menganalisis...', 'info');
                
                const payload = {
                    contents: [{
                        parts: [
                            { text: "Sebutkan dengan sangat detail objek atau pergerakan apa yang tertangkap kamera dalam 1 kalimat bahasa Indonesia." },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image.split(',')[1] } }
                        ]
                    }]
                };

                try {
                    const response = await fetch(AI_MODEL_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Aktivitas mikro terdeteksi.";
                    addLog(`DETAIL PERGERAKAN: ${resultText}`, 'ai');
                    speakIndonesian(resultText);
                } catch (error) {
                    addLog('ERROR: Sensor AI terganggu.', 'alert');
                }
                setIsAnalyzing(false);
            };

            const processFrame = useCallback(() => {
                if (!isMonitoring || !videoRef.current || !canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d', { willReadFrequently: true });
                if (!ctx) return;

                // Menggunakan resolusi sedikit lebih tinggi untuk akurasi sensor (80x60)
                ctx.drawImage(videoRef.current, 0, 0, 80, 60);
                const currentFrame = ctx.getImageData(0, 0, 80, 60);

                if (previousFrameRef.current) {
                    let diff = 0;
                    for (let i = 0; i < currentFrame.data.length; i += 4) {
                        // Membandingkan R, G, B untuk sensitivitas cahaya
                        const rDist = Math.abs(currentFrame.data[i] - previousFrameRef.current.data[i]);
                        const gDist = Math.abs(currentFrame.data[i+1] - previousFrameRef.current.data[i+1]);
                        const bDist = Math.abs(currentFrame.data[i+2] - previousFrameRef.current.data[i+2]);
                        
                        if ((rDist + gDist + bDist) > FRAME_DIFF_SENSITIVITY) diff++;
                    }
                    
                    const motion = (diff / (currentFrame.data.length / 4)) * 100;
                    setMotionLevel(motion);

                    if (motion > MOTION_THRESHOLD && !isAnalyzing) {
                        const now = Date.now();
                        if (now - lastAnalysisTimeRef.current > AI_COOLDOWN_MS) {
                            lastAnalysisTimeRef.current = now;
                            const capCtx = captureCanvasRef.current.getContext('2d');
                            captureCanvasRef.current.width = videoRef.current.videoWidth;
                            captureCanvasRef.current.height = videoRef.current.videoHeight;
                            capCtx.drawImage(videoRef.current, 0, 0);
                            analyzeImage(captureCanvasRef.current.toDataURL('image/jpeg'));
                        }
                    }
                }
                previousFrameRef.current = currentFrame;
                requestRef.current = requestAnimationFrame(processFrame);
            }, [isMonitoring, isAnalyzing]);

            useEffect(() => {
                if (isMonitoring) requestRef.current = requestAnimationFrame(processFrame);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isMonitoring, processFrame]);

            const initSystem = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: 1280 } 
                    });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                    setIsMonitoring(true);
                    addLog('KALIBRASI SELESAI: Sensor berada pada sensitivitas maksimum.', 'info');
                    speakIndonesian('Sensor ultra sensitif aktif.');
                } catch (err) {
                    addLog('FATAL: Perangkat keras sensor gagal.', 'alert');
                }
            };

            return (
                <div className="min-h-screen p-4 sm:p-10 flex flex-col items-center">
                    <header className="w-full max-w-6xl flex justify-between items-center border-b border-green-900 pb-4 mb-8">
                        <div className="flex items-center gap-4">
                            <i data-lucide="zap" className={`w-8 h-8 ${isMonitoring ? 'text-yellow-400 animate-pulse' : 'text-green-900'}`}></i>
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter uppercase leading-none">Neural-Eye <span className="text-white">v2.5</span></h1>
                                <p className="text-[10px] text-yellow-600 font-bold tracking-widest uppercase">Ultra-Sensitive Mode Active</p>
                            </div>
                        </div>
                        <button onClick={() => setIsMonitoring(!isMonitoring)} className={`p-2 border-2 ${isMonitoring ? 'border-red-500 text-red-500' : 'border-green-500 text-green-500'}`}>
                           <i data-lucide={isMonitoring ? "stop-circle" : "play"}></i>
                        </button>
                    </header>

                    <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-3">
                            <div className="relative aspect-video bg-black border-2 border-green-900 overflow-hidden crt-effect">
                                <video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover transition-opacity duration-700 ${isMonitoring ? 'opacity-80' : 'opacity-10'}`} />
                                
                                {isMonitoring && (
                                    <div className="absolute inset-0 pointer-events-none">
                                        <div className="absolute top-0 left-0 w-full h-[1px] bg-red-500/40 shadow-[0_0_15px_red] animate-[scanline_2s_linear_infinite]"></div>
                                        
                                        {/* Sensitive Motion Meter */}
                                        <div className="absolute top-1/2 right-6 -translate-y-1/2 w-8 h-48 bg-zinc-900/80 border border-green-900 flex flex-col-reverse p-1">
                                            <div className="w-full transition-all duration-100" style={{ height: `${Math.min(motionLevel * 5, 100)}%`, backgroundColor: motionLevel > MOTION_THRESHOLD ? '#ef4444' : '#22c55e' }}></div>
                                        </div>
                                        
                                        <div className="absolute top-4 left-4 flex gap-2">
                                            <div className="bg-red-600 text-black px-2 py-0.5 text-[10px] font-bold">HYPER-SENSE</div>
                                            <div className="bg-black/80 text-green-500 px-2 py-0.5 text-[10px] border border-green-900">ACTIVITY: {motionLevel.toFixed(2)}%</div>
                                        </div>
                                    </div>
                                )}

                                {isAnalyzing && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-yellow-500/10 backdrop-blur-[2px]">
                                        <div className="border border-yellow-500 bg-black/95 p-4 flex flex-col items-center">
                                            <i data-lucide="refresh-cw" className="w-8 h-8 text-yellow-500 animate-spin mb-2"></i>
                                            <p className="text-[10px] font-black tracking-widest text-yellow-500">CAPTURING_MICRO_DATA...</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <button onClick={isMonitoring ? () => setIsMonitoring(false) : initSystem} className={`w-full mt-6 py-5 font-black border-2 transition-all ${isMonitoring ? 'bg-red-950/20 border-red-500 text-red-500' : 'bg-green-950/20 border-green-500 text-green-400'}`}>
                                {isMonitoring ? 'DEACTIVATE SENSORS' : 'INITIALIZE HYPER-SENSE LINK'}
                            </button>
                        </div>

                        <div className="bg-zinc-950/80 border-2 border-green-900 p-4 h-full flex flex-col overflow-hidden">
                            <p className="text-[10px] text-green-700 font-bold uppercase mb-4">Neural_Analysis_Stream</p>
                            <div ref={logsContainerRef} className="text-[10px] space-y-3 overflow-y-auto scrollbar-hide flex-1">
                                {logs.map(log => (
                                    <div key={log.id} className={`border-l-2 pl-3 py-1 ${log.type === 'alert' ? 'border-red-500 text-red-400' : log.type === 'ai' ? 'border-yellow-500 text-yellow-100' : 'border-green-800 text-green-600'}`}>
                                        <p className="opacity-40 text-[8px] mb-1">{log.timestamp} - {log.type.toUpperCase()}</p>
                                        <p className="font-bold leading-tight">{log.message}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    <canvas ref={canvasRef} width="80" height="60" className="hidden"></canvas>
                    <canvas ref={captureCanvasRef} className="hidden"></canvas>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
