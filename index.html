<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-EYE v2.5 | Ultra-Sensitive Recon</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .matrix-bg {
            background: radial-gradient(circle, #050505 0%, #000 100%);
        }
        .crt-effect::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 10;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="matrix-bg text-[#00ff41] font-mono overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Configuration - Ambil dari Secrets jika tersedia
        const API_KEY = ""; 
        const AI_MODEL_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
        const AI_COOLDOWN_MS = 6000;
        const MOTION_THRESHOLD = 2.5; // Sangat Sensitif

        function App() {
            const [isMonitoring, setIsMonitoring] = useState(false);
            const [audioEnabled, setAudioEnabled] = useState(true);
            const [logs, setLogs] = useState([]);
            const [motionLevel, setMotionLevel] = useState(0);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isTalking, setIsTalking] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const captureCanvasRef = useRef(null);
            const previousFrameRef = useRef(null);
            const requestRef = useRef(0);
            const lastAnalysisTimeRef = useRef(0);
            const logsContainerRef = useRef(null);

            const addLog = useCallback((message, type = 'info') => {
                setLogs(prev => [...prev.slice(-25), {
                    id: Math.random().toString(36).substr(2, 9),
                    timestamp: new Date().toLocaleTimeString('id-ID', { hour12: false }),
                    message,
                    type
                }]);
            }, []);

            const speakIndonesian = useCallback((text) => {
                if (!audioEnabled || !('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.onstart = () => setIsTalking(true);
                utterance.onend = () => setIsTalking(false);
                window.speechSynthesis.speak(utterance);
            }, [audioEnabled]);

            const analyzeImage = async (base64Image) => {
                setIsAnalyzing(true);
                addLog('SENSOR: Mengunci target visual...', 'info');
                
                const payload = {
                    contents: [{
                        parts: [
                            { text: "Identifikasi apa yang ada di depan kamera dalam 1 kalimat pendek bahasa Indonesia yang taktis." },
                            { inlineData: { mimeType: "image/jpeg", data: base64Image.split(',')[1] } }
                        ]
                    }]
                };

                try {
                    const response = await fetch(AI_MODEL_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Target anonim.";
                    addLog(`INTEL: ${resultText}`, 'ai');
                    speakIndonesian(resultText);
                } catch (error) {
                    addLog('ERROR: Gangguan sinyal neural.', 'alert');
                }
                setIsAnalyzing(false);
            };

            const processFrame = useCallback(() => {
                if (!isMonitoring || !videoRef.current || !canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d', { willReadFrequently: true });
                if (!ctx) return;

                ctx.drawImage(videoRef.current, 0, 0, 64, 48);
                const currentFrame = ctx.getImageData(0, 0, 64, 48);

                if (previousFrameRef.current) {
                    let diff = 0;
                    for (let i = 0; i < currentFrame.data.length; i += 4) {
                        if (Math.abs(currentFrame.data[i] - previousFrameRef.current.data[i]) > 20) diff++;
                    }
                    const motion = (diff / (currentFrame.data.length / 4)) * 100;
                    setMotionLevel(motion);

                    if (motion > MOTION_THRESHOLD && !isAnalyzing) {
                        const now = Date.now();
                        if (now - lastAnalysisTimeRef.current > AI_COOLDOWN_MS) {
                            lastAnalysisTimeRef.current = now;
                            const capCtx = captureCanvasRef.current.getContext('2d');
                            captureCanvasRef.current.width = videoRef.current.videoWidth;
                            captureCanvasRef.current.height = videoRef.current.videoHeight;
                            capCtx.drawImage(videoRef.current, 0, 0);
                            analyzeImage(captureCanvasRef.current.toDataURL('image/jpeg'));
                        }
                    }
                }
                previousFrameRef.current = currentFrame;
                requestRef.current = requestAnimationFrame(processFrame);
            }, [isMonitoring, isAnalyzing]);

            useEffect(() => {
                if (isMonitoring) requestRef.current = requestAnimationFrame(processFrame);
                return () => cancelAnimationFrame(requestRef.current);
            }, [isMonitoring, processFrame]);

            const initSystem = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: 1280 } 
                    });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                    setIsMonitoring(true);
                    addLog('SISTEM AKTIF: Memulai sinkronisasi optik.', 'info');
                    speakIndonesian('Mata elang diaktifkan.');
                } catch (err) {
                    addLog('FATAL: Gagal mengakses sensor optik.', 'alert');
                }
            };

            return (
                <div className="min-h-screen p-4 sm:p-10 flex flex-col items-center">
                    {/* Header dengan Status Audio Animatif */}
                    <header className="w-full max-w-6xl flex justify-between items-end border-b border-[#003b00] pb-6 mb-10">
                        <div className="flex items-center gap-6">
                            <div className="relative">
                                <i data-lucide="crosshair" className={`w-10 h-10 ${isMonitoring ? 'text-red-500 animate-[spin_4s_linear_infinite]' : 'text-green-900'}`}></i>
                                {isMonitoring && <div className="absolute inset-0 bg-red-500 blur-xl opacity-20 animate-pulse"></div>}
                            </div>
                            <div>
                                <h1 className="text-3xl font-black tracking-tighter uppercase leading-none">Neural-Eye <span className="text-white">v2.5</span></h1>
                                <div className="flex items-center gap-2 mt-2">
                                    <span className="h-1 w-12 bg-green-900 rounded-full overflow-hidden">
                                        <div className={`h-full bg-green-400 ${isMonitoring ? 'w-full transition-all duration-1000' : 'w-0'}`}></div>
                                    </span>
                                    <p className="text-[10px] text-green-800 tracking-[0.4em] uppercase">Tactical Recon System</p>
                                </div>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            {isTalking && (
                                <div className="flex gap-1 h-6 items-center">
                                    {[1,2,3,4].map(i => <div key={i} className="w-1 bg-green-400 animate-pulse" style={{height: `${Math.random()*100}%`}}></div>)}
                                </div>
                            )}
                            <button onClick={() => setAudioEnabled(!audioEnabled)} className={`p-3 border-2 transition-colors ${audioEnabled ? 'border-green-500 text-green-400' : 'border-red-900 text-red-900'}`}>
                                <i data-lucide={audioEnabled ? "volume-2" : "volume-x"} className="w-5 h-5"></i>
                            </button>
                        </div>
                    </header>

                    <div className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-8">
                        <div className="lg:col-span-3">
                            {/* Viewport Utama dengan Overlay HUD */}
                            <div className="relative aspect-video bg-black border-2 border-[#003b00] overflow-hidden crt-effect group">
                                <video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover transition-all duration-1000 ${isMonitoring ? 'opacity-80 scale-100' : 'opacity-20 scale-110 blur-md'}`} />
                                
                                {isMonitoring && (
                                    <div className="absolute inset-0 pointer-events-none">
                                        {/* Scanline & Vignet */}
                                        <div className="absolute top-0 left-0 w-full h-[2px] bg-green-400/20 shadow-[0_0_15px_rgba(0,255,65,0.5)] animate-[scanline_4s_linear_infinite]"></div>
                                        
                                        {/* Sudut Frame HUD */}
                                        <div className="absolute top-4 left-4 w-12 h-12 border-t-2 border-l-2 border-green-500/50"></div>
                                        <div className="absolute top-4 right-4 w-12 h-12 border-t-2 border-r-2 border-green-500/50"></div>
                                        <div className="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-green-500/50"></div>
                                        <div className="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-green-500/50"></div>

                                        {/* Data Dinamis Overlay */}
                                        <div className="absolute top-8 left-10 flex flex-col gap-1">
                                            <div className="bg-red-600 text-black px-2 py-0.5 text-[10px] font-bold flex items-center gap-2">
                                                <div className="w-2 h-2 bg-black rounded-full animate-pulse"></div> LIVE_STREAM
                                            </div>
                                            <div className="text-[9px] bg-black/60 px-2 border border-green-900 uppercase">
                                                AZIMUTH: 182.4° // EL: 12.1°
                                            </div>
                                        </div>

                                        <div className="absolute bottom-8 right-10 text-right">
                                            <p className="text-[10px] opacity-60">BITRATE: 4500 KBPS</p>
                                            <p className="text-xs font-black italic tracking-widest text-white">LATENCY: 12MS</p>
                                        </div>
                                    </div>
                                )}

                                {isAnalyzing && (
                                    <div className="absolute inset-0 flex items-center justify-center bg-green-500/5 backdrop-blur-[2px]">
                                        <div className="border border-green-400 bg-black/90 p-8 flex flex-col items-center gap-4 shadow-[0_0_50px_rgba(0,255,65,0.1)]">
                                            <i data-lucide="zap" className="w-10 h-10 text-yellow-400 animate-bounce"></i>
                                            <p className="text-sm font-black tracking-[0.3em] animate-pulse">EXTRACTING_VISUAL_DATA</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <div className="mt-6 flex gap-4">
                                <button 
                                    onClick={isMonitoring ? () => setIsMonitoring(false) : initSystem}
                                    className={`flex-1 py-5 font-black border-2 transition-all flex items-center justify-center gap-4 ${isMonitoring ? 'bg-red-950/20 border-red-500 text-red-500 hover:bg-red-500 hover:text-black' : 'bg-green-950/20 border-green-500 text-green-400 hover:shadow-[0_0_30px_rgba(0,255,65,0.4)]'}`}
                                >
                                    <i data-lucide={isMonitoring ? "stop-circle" : "zap"} className="w-6 h-6"></i>
                                    {isMonitoring ? 'TERMINATE RECON' : 'INITIALIZE NEURAL LINK'}
                                </button>
                            </div>
                        </div>

                        {/* Sidebar Telemetri Sensitif */}
                        <div className="space-y-6">
                            <div className="bg-zinc-950/80 border-2 border-green-900 p-5 relative">
                                <div className="flex justify-between items-center mb-4">
                                    <p className="text-[10px] text-green-700 font-bold uppercase tracking-widest">Motion Sensor</p>
                                    <span className={`text-[10px] px-2 py-0.5 ${motionLevel > MOTION_THRESHOLD ? 'bg-red-600 text-white animate-pulse' : 'bg-green-900 text-green-300'}`}>
                                        {motionLevel > MOTION_THRESHOLD ? 'ACTIVITY' : 'STABLE'}
                                    </span>
                                </div>
                                <div className="h-10 w-full bg-zinc-900 border border-green-800 p-1 flex gap-[2px]">
                                    {Array.from({length: 12}).map((_, i) => (
                                        <div 
                                            key={i} 
                                            className={`flex-1 transition-all duration-300 ${i < (motionLevel/8) ? (motionLevel > MOTION_THRESHOLD*2 ? 'bg-red-500 shadow-[0_0_10px_rgba(255,0,0,0.5)]' : 'bg-green-500 shadow-[0_0_10px_rgba(0,255,65,0.3)]') : 'bg-zinc-800/40'}`}
                                        ></div>
                                    ))}
                                </div>
                                <p className="text-[9px] mt-2 opacity-40 text-right uppercase tracking-tighter">Sensitivity: Max (2.5%)</p>
                            </div>

                            <div className="bg-zinc-950/80 border-2 border-green-900 h-[400px] flex flex-col">
                                <div className="p-3 border-b border-green-900 text-[10px] bg-green-900/10 flex justify-between items-center">
                                    <span className="font-bold tracking-widest uppercase">Mission_Logs</span>
                                    <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                                </div>
                                <div ref={logsContainerRef} className="p-4 text-[10px] space-y-4 overflow-y-auto scrollbar-hide flex-1">
                                    {logs.length === 0 ? (
                                        <div className="h-full flex items-center justify-center opacity-20 italic">Standby...</div>
                                    ) : (
                                        logs.map(log => (
                                            <div key={log.id} className={`border-l-2 pl-3 py-1 ${log.type === 'alert' ? 'border-red-500 text-red-400 bg-red-500/5' : log.type === 'ai' ? 'border-yellow-500 text-yellow-100 bg-yellow-500/5' : 'border-green-800 text-green-600'}`}>
                                                <div className="flex justify-between text-[8px] opacity-40 mb-1">
                                                    <span>{log.type.toUpperCase()}</span>
                                                    <span>{log.timestamp}</span>
                                                </div>
                                                <p className="leading-tight font-bold">{log.message}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                    <canvas ref={canvasRef} width="64" height="48" className="hidden"></canvas>
                    <canvas ref={captureCanvasRef} className="hidden"></canvas>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
